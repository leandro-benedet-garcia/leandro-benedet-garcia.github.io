<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Leandro Portfolio Preview Canvas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      width: 1200px;
      height: 630px;
      background-color: #0d0e12;
      color: #ffffff;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    .branding-panel {
      width: 45%;
      height: 100%;
      background: linear-gradient(135deg, #13151c 0%, #0d0e12 100%);
      padding: 55px 45px 85px 45px;
      display: flex;
      flex-direction: column;
      border-right: 3px solid #1f2330;
      z-index: 10;
      box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .header-group h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      margin-bottom: 6px;
    }

    .header-group h2 {
      font-size: 26px;
      font-weight: 600;
      color: #ff4a5a;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 35px;
    }

    .metrics-list {
      list-style: square;
      padding-left: 24px;
    }

    .metrics-list li {
      font-size: 19px;
      color: #b3b8c9;
      margin-bottom: 20px;
      line-height: 1.4;
    }


    .metrics-list li::marker {
      font-size: 1.25rem;
      color: #ff4a5a;
    }

    .metrics-list li strong {
      color: #ffffff;
    }


    .engine-pills {
      display: flex;
      gap: 12px;
      position: absolute;
      bottom: 40px;
      left: 45px;
    }

    .pill {
      background-color: #1f2330;
      border: 1px solid #31374d;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 700;
      color: #e2e5f0;
      letter-spacing: 0.5px;
    }

    .pill.highlight {
      border-color: #ff4a5a;
      color: #ff4a5a;
    }


    .showcase-panel {
      width: 55%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .showcase-row {
      height: 33.333%;
      width: 100%;
      position: relative;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 12px;
      border-bottom: 2px solid #1f2330;
    }

    .showcase-row:last-child {
      border-bottom: none;
    }


    .row-top {
      background-image: url('assets/images/games/exosky/cover.jpg');
      background-color: #1a2c42;
    }

    .row-middle {
      background-image: url('assets/images/games/multiplayer_builder/building.png');
      background-color: #213a2b;
    }

    .row-bottom {
      background-image: url('assets/images/games/slutty_bass/beach.png');
      background-color: #3b1e30;
    }

    .project-badge {
      background: rgba(13, 14, 18, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
  </style>
</head>

<body>
  <div class="branding-panel">
    <div class="header-group">
      <h1>Leandro Benedet Garcia</h1>
      <h2>Senior Gameplay Engineer</h2>
    </div>

    <div class="engine-pills">
      <span class="pill highlight">UNITY (C#)</span>
      <span class="pill highlight">GODOT (GdScript, C#, C++)</span>
    </div>
  </div>

  <div class="showcase-panel">
    <div class="showcase-row row-top">
    </div>

    <div class="showcase-row row-middle">
    </div>

    <div class="showcase-row row-bottom">
    </div>
  </div>

</body>

</html>
